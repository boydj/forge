# systemd drop-in for grafana-server.service on the monitor host, installed by
# `scripts/deploy monitor` as
#   /etc/systemd/system/grafana-server.service.d/forge.conf
# Grafana reads GF_<SECTION>_<KEY> from the environment, which beats editing
# the package's grafana.ini conffile. Loopback only: the operator reaches it
# with `ssh -L 3000:127.0.0.1:3000 -p 2200 deploy@mon1.nodes.<zone>`
# (docs/monitoring.md). First login is admin/admin and Grafana forces a
# password change; nothing else can reach the port.
[Service]
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3000
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_USERS_ALLOW_ORG_CREATE=false
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_SECURITY_DISABLE_GRAVATAR=true
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
