# Grafana OSS from the upstream apt repository, pinned. Sourced by
# `scripts/deploy monitor` (shell variables; no expansions, no secrets).
#
# The signing key is fetched on the monitor host and its primary fingerprint
# compared with GRAFANA_APT_KEY_FPR before it is dearmored into
# /etc/apt/keyrings/grafana.gpg; a mismatch aborts the install. Fingerprint
# recorded 2026-09-11 from https://apt.grafana.com/gpg.key
# ("Grafana Labs <engineering@grafana.com>", created 2023-08-24).
# Rotate here (and only here) when Grafana rotates the key.
GRAFANA_APT_KEY_URL="https://apt.grafana.com/gpg.key"
GRAFANA_APT_KEY_FPR="B53AE77BADB630A683046005963FA27710458545"
GRAFANA_APT_REPO="deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
GRAFANA_APT_PACKAGE="grafana"
