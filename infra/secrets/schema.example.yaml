# Plaintext EXAMPLE of a secret bundle. Every value is a placeholder.
# `scripts/secrets edit infra/secrets/<env>.enc.yaml` seeds a new file from it.
# Schema: infra/secrets/README.md
schema_version: 1

# OpenTofu providers (exported by `scripts/secrets env`)
vultr_api_key: "REPLACE-vultr-api-key"
cloudflare_api_token: "REPLACE-cloudflare-zone-scoped-token"

# BGP (TCP-MD5) password chosen in the Vultr BGP request form
vultr_bgp_password: "REPLACE-bgp-md5-password"

# WireGuard private keys, one per POP (`scripts/secrets gen-wg ewr1`)
wireguard_private_keys:
  ewr1: "REPLACE-base64-x25519-private-key="

# Service TLS identity, shared by every POP (`scripts/secrets gen-tls git.as215520.net`)
forge_tls_key: |
  -----BEGIN PRIVATE KEY-----
  REPLACE
  -----END PRIVATE KEY-----
forge_tls_cert: |
  -----BEGIN CERTIFICATE-----
  REPLACE
  -----END CERTIFICATE-----

# Git-over-SSH host key, shared by every POP (`scripts/secrets gen-hostkey`)
ssh_host_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  REPLACE
  -----END OPENSSH PRIVATE KEY-----

# forge cluster RPC shared secret (`openssl rand -hex 32`)
cluster_secret: "REPLACE-64-hex-chars"

# age identity whose public half encrypts node backups (`age-keygen`)
backup_encryption_key: "AGE-SECRET-KEY-1REPLACE"

# RIPE Database API key (RIPE DB > My Account > API keys), format KEYID:SECRET,
# scoped to JOSHBOYD-MNT, expires within a year. Used only by scripts/ripe-submit
# from the operator machine; never shipped to nodes.
ripe_db_api_key: "KEYID:SECRET"   # alias accepted: ripedb_api_key

# Backblaze B2 for off-site backups (infra/opentofu/environments/b2).
# b2_admin_*: the operator's console key that OpenTofu uses to create the
# bucket and the writer key (laptop only, never shipped to a node).
# b2_backup_*: the write-only key OpenTofu creates (tofu output writer_key_id
# / writer_key); scripts/deploy turns it into /run/forge/secrets/rclone.conf
# on every node.
b2_admin_key_id: "REPLACE-b2-admin-key-id"
b2_admin_key: "REPLACE-b2-admin-key"
b2_backup_key_id: "REPLACE-from-tofu-output"
b2_backup_key: "REPLACE-from-tofu-output"
