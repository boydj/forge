plans:
  cheapest_suitable:
    - id: vc2-1c-1gb
      monthly_usd: 5.00
      hourly_usd: 0.007
      bandwidth_gb: 1024
      locations: [ewr, ord, dfw, sea, lax, atl, ams, lhr, fra, sjc, syd, yto, cdg, nrt, waw, mad, icn, mia, sgp, sto, mex, sao, mel, bom, jnb, tlv, blr, del, scl, itm, man]
      location_cost_overrides: { sao: 7.50 }
    - id: vhp-1c-1gb-intel
      monthly_usd: 6.00
      bandwidth_gb: 2048
      locations: [ewr, ord, dfw, sea, lax, atl, ams, lhr, fra, sjc, syd, yto, cdg, nrt, waw, mad, icn, mia, sgp, sto, mex, sao, mel, hnl, bom, jnb, tlv, blr, del, scl, itm, man]
    - id: vhp-1c-1gb-amd
      monthly_usd: 6.00
      bandwidth_gb: 2048
  sandbox_unverified_for_bgp:
    - { id: vc2-1c-0.5gb, monthly_usd: 3.50, account_cap: 5, locations: [ewr] }
    - { id: vc2-1c-0.5gb-v6, monthly_usd: 2.50, ipv6_only: true, account_cap: 2, locations: [ewr,atl] }
  addons:
    bandwidth_overage_usd_per_gb: 0.01
    backups_pct_of_plan: 20
    snapshot_usd_per_gb_month: 0.05
    block_storage_usd_per_gb_month: { hdd: 0.025, nvme: 0.10 }
    ddos_protection_usd_per_month: { value: 12, verify: true }

os_images:
  debian_12: 2136
  debian_13: 2625
  ubuntu_22_04: 1743
  ubuntu_24_04: 2284
  ubuntu_26_04: 2760
  alpine: 2076
  cloud_init: linux_images_all

ipv6:
  per_instance_prefix: 64
  gateway: "fe80::1"
  config: slaac_ra
  nameservers: ["108.61.10.10", "2001:19f0:300:1704::6"]
  additional_subnets: assignable
  bgp_supported: true

metadata:
  base_url: http://169.254.169.254
  json_endpoint: /v1.json
  header: { Metadata-Token: cloudinit }
  keys:
    - bgp.ipv4.my-address
    - bgp.ipv4.my-asn
    - bgp.ipv4.peer-address
    - bgp.ipv4.peer-asn
    - bgp.ipv6.my-address
    - bgp.ipv6.my-asn
    - bgp.ipv6.peer-address
    - bgp.ipv6.peer-asn
    - hostname
    - instance-v2-id
    - instanceid
    - interfaces[].mac
    - interfaces[].network-type
    - interfaces[].ipv4.address
    - interfaces[].ipv4.gateway
    - interfaces[].ipv4.netmask
    - interfaces[].ipv4.additional[]
    - interfaces[].ipv6.address
    - interfaces[].ipv6.network
    - interfaces[].ipv6.prefix
    - interfaces[].ipv6.additional[]
    - public-keys[]
    - region.regioncode
    - region.countrycode
    - user-defined[]
    - startup-script
    - user-data
    - vendor-data

firewall:
  resources: [vultr_firewall_group, vultr_firewall_rule]
  direction: inbound_only
  ip_types: [v4, v6]
  protocols: [icmp, tcp, udp, gre, esp, ah]
  sources: ["", cloudflare]
  covers_byoip_addresses: unknown
  host_nftables_required: true
  bgp_allow:
    - { proto: tcp, port: 179, from: 169.254.169.254/32 }
    - { proto: tcp, port: 179, from: "2001:19f0:ffff::1/128" }

vpc:
  resource: vultr_vpc
  region_bound: true
  ipv6: false
  max_per_location: 5
  vpc2_status: deprecated_in_provider_2.25.0
  cross_region: wireguard_required

terraform:
  provider: vultr/vultr
  version: 2.32.0
  released: 2026-07-14
  opentofu_verified: 1.12.6
  registry: registry.opentofu.org/vultr/vultr
  provider_args: { api_key: env VULTR_API_KEY, rate_limit_ms: 500, retry_limit: 3 }
  api_rate_limit_rps: 30

limits:
  api_rps: 30
  new_account_instances: { default: 1, verify: true }
  raise_limits: "Billing > Account limits > Request Limit Increase"
