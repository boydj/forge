# Machine-readable Vultr facts for the anycast deployment. Researched 2026-09-10.
# Sources are listed in docs/research/vultr.md. Values marked verify: true are unconfirmed.
provider: vultr
customer:
  asn: 215520
  rir: RIPE
  prefixes_planned: { ipv4: /24, ipv6: /48 }

bgp:
  vultr_public_asn: 20473
  cloud_compute:
    peer_asn: 64515
    peer_ipv4: 169.254.169.254
    peer_ipv6: "2001:19f0:ffff::1"
    multihop: 2
    auth: tcp-md5              # password set by customer in the BGP request form
    source_address: main_ip_only
  bare_metal:
    peer_asn: 20473
    peer_ipv4: 169.254.1.1
    peer_ipv6: "2001:19f0:ffff::1"
    multihop: 2
  external_as_path: "20473 215520"
  min_announce: { ipv4: 24, ipv6: 48 }
  default_export: global       # no implicit no-export; do NOT set 20473:6000
  enable_process:
    console_url: https://console.vultr.com/bgp/setup/
    console_path: "Products > Network > BGP > Get Started"
    requires_active_instance: true
    human_review: true
    loa_required: true
    loa_wording: "authorize Vultr (AS20473) to announce the listed prefixes"
  api:
    list_prefixes: { method: GET, path: /v2/account/bgp/prefixes, verify: true }
    setup_request: { method: POST, path: /v2/account/bgp/setup, verify: true }
    terraform_resource: null   # none exists (provider 2.32.0)

communities:
  standard:
    "20473:6000": do_not_advertise_globally
    "20473:6001": prepend_1x_all
    "20473:6002": prepend_2x_all
    "20473:6003": prepend_3x_all
    "20473:64609": med_0_all
    "20473:6601": no_announce_to_ixp_peers
    "20473:6602": override_no_advertise_ix_route_servers
    "20473:6603": override_no_advertise_ix_and_bilateral
    "20473:666": blackhole
  per_peer:                    # replace peer-as with target ASN
    "64600:peer-as": do_not_advertise_to_peer
    "64601:peer-as": prepend_1x_to_peer
    "64602:peer-as": prepend_2x_to_peer
    "64603:peer-as": prepend_3x_to_peer
    "64609:peer-as": med_0_to_peer
    "64699:peer-as": override_do_not_advertise_to_peer
  large_per_peer:
    "20473:6000:peer-as": do_not_advertise_to_peer
    "20473:6001:peer-as": prepend_1x_to_peer
    "20473:6002:peer-as": prepend_2x_to_peer
    "20473:6003:peer-as": prepend_3x_to_peer
    "20473:6009:peer-as": med_0_to_peer
    "20473:6099:peer-as": override_do_not_advertise_to_peer
  informational:
    "20473:100": learned_from_transit
    "20473:200": learned_from_public_peer
    "20473:300": learned_from_private_peer
    "20473:500": originated_by_as20473
    "20473:4000": originated_by_customer
    "20473:NN": pop_location_two_digit
    "20473:0:3RRRCCC1PP": large_location_community

byoip:
  ipv4_prefix_range: [16, 24]
  ipv6_prefix_range: [32, 48]
  ipv6_supported: true
  max_prefixes_per_account: 5
  anycast_allowed: true
  instance_bgp_required: true
  vultr_originated_option: false   # only for Vultr-owned reserved IPs via AS64515
  roa:
    recommended: true
    origin_asn_required: 215520    # customer ASN when account uses its own ASN; AS20473 only for private-ASN accounts
    max_length: { ipv4: 24, ipv6: 48 }
    nightly_check: true
  irr:
    accepted: [RADB, ARIN, RIPE, APNIC]
    auto_create_in_radb: true
    as_set: "RADB::AS20473:AS-CONE"
  timeline:
    rir_poc_confirmation: same_day
    verification_hours: [24, 48]
    transit_filters_dynamic_hours: [6, 24]
    transit_filters_manual_hours_min: 48
  removal: support_ticket

